<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda</title>
    <link rel="stylesheet" href="/static/style_novo.css">
  </head>
  <body>
    <nav class="navbar">
      <h1>Agenda Mensal</h1>
      <ul class="nav-menu">
        <li><a href="/">Home</a></li>
        <li><a href="/agenda">Agenda</a></li>
        <li><a href="/relatorio">Relatório</a></li>
        <li><a href="/config">Configurações</a></li>
      </ul>
    </nav>

    <div class="container">
      <section id="agenda" class="section">
        <h2>📅 Gerenciador de Responsabilidades</h2>

        <div style="display: flex; gap: 1rem; margin-bottom: 2rem; justify-content: space-between; align-items: center;">
          <button class="btn-relatorio" onclick="baixarRelatorio()">📄 Baixar Relatório (PDF)</button>
        </div>

        <div class="form-container">
          <h3>Adicionar Nova Responsabilidade</h3>
          <form id="formResponsabilidade">
            <div class="form-group">
              <label for="descricao">Descrição da Responsabilidade:</label>
              <input type="text" id="descricao" name="descricao" placeholder="Ex: Enviar declaração de IR" required>
            </div>

            <div class="form-group">
              <label for="data">Data de Execução:</label>
              <input type="date" id="data" name="data" required>
            </div>

            <div class="form-group">
              <label for="situacao">Situação:</label>
              <select id="situacao" name="situacao" required>
                <option value="pendente">Pendente</option>
                <option value="em_progresso">Em Progresso</option>
                <option value="concluido">Concluído</option>
              </select>
            </div>

            <button type="submit" class="btn-adicionar">➕ Adicionar Responsabilidade</button>
          </form>
        </div>

        <div class="agenda-container">
          <h3>Responsabilidades do Mês</h3>
          <table class="tabela-responsabilidades">
            <thead>
              <tr>
                <th>Descrição</th>
                <th>Data</th>
                <th>Situação</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody id="tabelaResponsabilidades">
              <tr>
                <td colspan="4" class="sem-dados">Nenhuma responsabilidade adicionada ainda</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </div>

    <script src="/static/script.js"></script>
  </body>
</html>
